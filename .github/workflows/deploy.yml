
name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: Automatically select HMR or reboot (overrides available for maintenance)
        required: true
        type: choice
        default: auto
        options:
          - auto
          - hmr
          - reboot
      reboot_reason:
        description: Reason shown to players before the reboot (blank uses the repository default)
        required: false
        type: string
      reboot_notice_seconds:
        description: Seconds between the announcement and restart (1-600)
        required: false
        type: string
        default: '60'
concurrency:
  group: game-server-production
  cancel-in-progress: false
jobs:
  build:
    name: Build and Deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare reboot announcement
        id: reboot
        env:
          REBOOT_REASON: ${{ inputs.reboot_reason || vars.GAME_SERVER_REBOOT_REASON || 'We are deploying a game update.' }}
          REBOOT_NOTICE_SECONDS: ${{ inputs.reboot_notice_seconds || 60 }}
        run: |
          if ! [[ "$REBOOT_NOTICE_SECONDS" =~ ^[1-9][0-9]{0,2}$ ]] || (( REBOOT_NOTICE_SECONDS > 600 )); then
            echo "Reboot notice must be between 1 and 600 seconds." >&2
            exit 1
          fi
          echo "reason_base64=$(printf '%s' "$REBOOT_REASON" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          echo "notice_seconds=$REBOOT_NOTICE_SECONDS" >> "$GITHUB_OUTPUT"

      - name: Validate deployment safeguards
        run: |
          bash -n bin/deploy-game-server.sh
          bash -n bin/deploy-live-game-server.sh
          PYTHONDONTWRITEBYTECODE=1 python3 bin/deploy-game-server.test.py
          PYTHONDONTWRITEBYTECODE=1 python3 bin/deploy-live-game-server.test.py

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker build -f Dockerfile.prod --build-arg GAME_RELEASE_ID=${{ github.sha }} -t balkshamster/looperlands:${{ github.sha }} -t balkshamster/looperlands:latest .

      - name: Push Docker Image to Docker Hub
        run: |
          docker push balkshamster/looperlands:${{ github.sha }}
          docker push balkshamster/looperlands:latest
      - name: Check deployment destination
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
        run: |
          python3 - <<'PY'
          import os, socket

          host = os.environ["DEPLOY_HOST"].strip().lower().rstrip(".")
          print("Uses expired LoopWorms domain:",
                host == "loopworms.io" or host.endswith(".loopworms.io"))
          try:
              addresses = {
                  entry[4][0] for entry in socket.getaddrinfo(host, 22)
              }
              print("Resolves to current game IP 62.72.0.23:",
                    "62.72.0.23" in addresses)
          except OSError:
              print("Deployment hostname could not be resolved")
          PY
      - name: Upload deployment safeguards
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          source: "bin/deploy-game-server.sh,bin/deploy-game-server.py"
          target: "/tmp/looperlands-deploy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Deploy both game servers with automatic HMR or announced reboots
        uses: appleboy/ssh-action@v0.1.7
        env:
          REBOOT_REASON_BASE64: ${{ steps.reboot.outputs.reason_base64 }}
          REBOOT_NOTICE_SECONDS: ${{ steps.reboot.outputs.notice_seconds }}
          DEPLOY_MODE: ${{ inputs.deployment_mode || 'auto' }}
          LIVE_UPDATE_IMAGE: balkshamster/looperlands:${{ github.sha }}
          LIVE_UPDATE_SERVICES: ${{ vars.GAME_SERVER_LIVE_SERVICES || 'gameserver gameserver2' }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          command_timeout: 20m
          envs: REBOOT_REASON_BASE64,REBOOT_NOTICE_SECONDS,DEPLOY_MODE,LIVE_UPDATE_IMAGE,LIVE_UPDATE_SERVICES
          script: |
            bash /tmp/looperlands-deploy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/bin/deploy-game-server.sh

      - name: Clean deployment uploads
        if: always()
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            python3 - "looperlands-deploy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" <<'PY'
            import os, re, shutil, stat, sys, time
            current = sys.argv[1]
            if not re.fullmatch(r'looperlands-deploy-[a-f0-9]{40}-[0-9]+-[0-9]+', current):
                sys.exit('Invalid deployment staging directory')
            for entry in os.scandir('/tmp'):
                legacy = re.fullmatch(r'looperlands-(deploy|preflight)-[a-f0-9]{40}', entry.name)
                other_run = re.fullmatch(r'looperlands-deploy-[a-f0-9]{40}-[0-9]+-[0-9]+', entry.name)
                if entry.name != current and not legacy and not other_run:
                    continue
                info = entry.stat(follow_symlinks=False)
                if info.st_uid != os.getuid() or not stat.S_ISDIR(info.st_mode):
                    continue
                expired = (legacy and info.st_mtime < time.time() - 900) or (other_run and info.st_mtime < time.time() - 86400)
                if entry.name == current or expired:
                    shutil.rmtree(entry.path)
            PY
