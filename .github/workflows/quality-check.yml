name: Quality Check

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Validate deployment safeguards
      run: |
        bash -n bin/deploy-game-server.sh
        bash -n bin/deploy-live-game-server.sh
        PYTHONDONTWRITEBYTECODE=1 python3 bin/deploy-game-server.test.py
        PYTHONDONTWRITEBYTECODE=1 python3 bin/deploy-live-game-server.test.py
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
    - name: Install dependencies
      run: npm ci
    - name: Run linter
      run: npx eslint client --ext .js,.jsx,.ts,.tsx --quiet && npx eslint server --ext .js,.jsx,.ts,.tsx --quiet && npx eslint shared --ext .js,.jsx,.ts,.tsx --quiet
    - name: Run unit tests
      run: npm run coverage
    - name: Build production image
      run: docker build -f Dockerfile.prod --build-arg GAME_RELEASE_ID=${{ github.sha }} -t looperlands-node-validation .
    - name: Build local toolbox image
      run: docker build -t looperlands-local-validation .
    - name: Check local toolbox runtime
      run: |
        docker run --rm --network none --env LOOPERLANDS_LOCAL_PLAYTEST=1 --entrypoint node looperlands-local-validation -e '
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const {execFileSync} = require("node:child_process");
          assert.equal(process.version, "v" + fs.readFileSync(".nvmrc", "utf8").trim());
          execFileSync("python3", ["-c", "from lxml import etree"]);
          execFileSync("git", ["--version"]);
          const {LooperLandsPlatformClient} = require("./server/js/looperlandsplatformclient");
          assert.equal(new LooperLandsPlatformClient().localPlaytest, true);
          console.log("Local toolbox runtime:", process.version, process.arch);
        '
    - name: Check production runtime
      run: |
        docker run --rm --network none --entrypoint node looperlands-node-validation -e '
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          assert.equal(process.version, "v" + fs.readFileSync(".nvmrc", "utf8").trim());
          process.env.LOOPERLANDS_LOCAL_PLAYTEST = "1";
          assert.equal(require("./server/js/localplaytest").isLocalPlaytest(), false);
          assert.notEqual(new (require("./server/js/looperlandsplatformclient").LooperLandsPlatformClient)().localPlaytest, true);
          const manifest = JSON.parse(fs.readFileSync(".live-release.json", "utf8"));
          for (const folder of ["quests", "npcs", "worlds", "tiles"]) {
            const directory = "tools/" + folder;
            if (!fs.existsSync(directory)) continue;
            for (const file of fs.readdirSync(directory).filter(name => name.endsWith(".json"))) {
              assert.ok(manifest.files[directory + "/" + file], "Saved content missing from release: " + file);
            }
          }
          Object.assign(process.env, {
            NEW_RELIC_APP_NAME: "runtime-validation",
            NEW_RELIC_LICENSE_KEY: "0".repeat(40),
            NEW_RELIC_HOST: "127.0.0.1",
            NEW_RELIC_PORT: "1",
            NEW_RELIC_SSL: "false"
          });
          const newrelic = require("newrelic");
          assert.ok(newrelic.agent, "New Relic agent must initialize");
          require("express");
          require("socket.io");
          console.log("Production runtime:", process.version);
          newrelic.shutdown({collectPendingData: false}, error => { if (error) throw error; });
        '
