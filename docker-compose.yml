services:
  gameserver:
    image: balkshamster/looperlands:latest
    ports:
      - "8000:443"
    env_file:
      - /home/looperlands/.env
    environment:
      ACTIVITY_SPOOL_PATH: /var/lib/looperlands/activity/activity.jsonl
    volumes:
      - activity_spool_1:/var/lib/looperlands/activity
      - chat-history:/opt/app/data/chat
  gameserver2:
    image: balkshamster/looperlands:latest
    ports:
      - "8001:443"
    env_file:
      - /home/looperlands/.env2
    environment:
      ACTIVITY_SPOOL_PATH: /var/lib/looperlands/activity/activity.jsonl
    volumes:
      - activity_spool_2:/var/lib/looperlands/activity
      - chat-history-2:/opt/app/data/chat

volumes:
  activity_spool_1:
  activity_spool_2:
  chat-history:
  chat-history-2:
