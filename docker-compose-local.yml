services:
  gameserver:
    build: .
    image: looperlands-gameserver
    command: ["node", "bin/local-mapmaker.js"]
    environment:
      NODE_ENV: development
      LOOPERLANDS_ASSET_API_BASE_URL: ${LOOPERLANDS_ASSET_API_BASE_URL:-}
      LOOPERLANDS_ASSET_API_KEY: ${LOOPERLANDS_ASSET_API_KEY:-}
      LOOPERLANDS_LOCAL_PLAYTEST: "1"
      LOOPERLANDS_OWNERSHIP_BASE_URL: ${LOOPERLANDS_OWNERSHIP_BASE_URL:-}
      LOOPERLANDS_OWNERSHIP_API_KEY: ${LOOPERLANDS_OWNERSHIP_API_KEY:-}
      LOOPERLANDS_LOCAL_DATA_DIR: /opt/app/data/local-playtest
      MAPMAKER_CHECKOUT_DIR: /workspace
      LOOPWORMS_API_KEY: ${LOOPWORMS_API_KEY:-placeholder}
      LOOPWORMS_LOOPERLANDS_BASE_URL: ${LOOPWORMS_LOOPERLANDS_BASE_URL:-http://jsonserver}
      DISCORD_TOKEN: ""
      LOOPERLANDS_BACKEND_BASE_URL: ${LOOPERLANDS_BACKEND_BASE_URL:-http://jsonserver}
      LOOPERLANDS_BACKEND_API_KEY: ${LOOPERLANDS_BACKEND_API_KEY:-http://jsonserver}
      APP_URL: http://${LOCAL_IP:-127.0.0.1}:8000
      GAMESERVER_NAME: local
    ports:
      - "${LOCAL_IP:-127.0.0.1}:8000:8000"
      - "${LOCAL_IP:-127.0.0.1}:8010:8010"
      - "127.0.0.1:9229:9229"
    stdin_open: true
    tty: true
    volumes:
      - local-chat-history:/opt/app/data/chat
      - local-game-data:/opt/app/data/local-playtest
      - ./:/workspace:ro
      - ./shared:/opt/app/shared
      - ./client:/opt/app/client
      - ./server/maps:/opt/app/server/maps
      - ./server/local-launcher:/opt/app/server/local-launcher:ro
      - ./docs:/opt/app/docs:ro
      - ./tools/maps:/opt/app/tools/maps
      - ./tools/quests:/opt/app/tools/quests
      - ./tools/npcs:/opt/app/tools/npcs
      - ./tools/worlds:/opt/app/tools/worlds
      - ./tools/tiles:/opt/app/tools/tiles
      - ./tools/interactions:/opt/app/tools/interactions
    depends_on:
      - jsonserver
    develop:
      watch:
        - path: server/
          action: rebuild
        - path: client/
          action: rebuild
        - path: shared/
          action: rebuild

  jsonserver:
    platform: linux/amd64
    image: codfish/json-server:0.17.3
    volumes:
      - ./mock/db.js:/app/db.js:delegated
      - ./mock/middleware.js:/app/middleware.js:delegated
      - ./mock/routes.json:/app/routes.json:delegated
    ports:
      - "127.0.0.1:3000:80"

volumes:
  local-chat-history:
  local-game-data:
